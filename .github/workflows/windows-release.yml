name: Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate release documentation
        shell: pwsh
        run: |
          $files = @('README_RU.md','README_EN.md','CHANGELOG.md','VERSION.txt')
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
          }
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION.txt value: $version" }
          Write-Host "Release version: $version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Neutrivox.sln

      - name: Release build
        run: dotnet build Neutrivox.sln --configuration Release --no-restore

      - name: Smoke build
        run: dotnet build tools/Neutrivox.Smoke/Neutrivox.Smoke.csproj --configuration Release

      - name: Smoke test
        run: dotnet run --project tools/Neutrivox.Smoke/Neutrivox.Smoke.csproj --configuration Release --no-build

      - name: Publish Windows x64
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -Configuration Release -Runtime win-x64 -OutputDirectory artifacts/windows

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = 'artifacts/windows/Neutrivox.exe'
          if (-not (Test-Path $exe)) { throw 'Published executable missing' }
          if ((Get-Item $exe).Length -le 0) { throw 'Published executable is empty' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc "/DMyAppVersion=$version" 'installer/Neutrivox.iss'

      - name: Verify installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $installer = "artifacts/installer/Neutrivox-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer missing: $installer" }
          if ((Get-Item $installer).Length -le 0) { throw 'Installer is empty' }

      - name: Create archives and checksums
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          Copy-Item README_RU.md artifacts/windows/
          Copy-Item README_EN.md artifacts/windows/
          Copy-Item CHANGELOG.md artifacts/windows/
          Copy-Item VERSION.txt artifacts/windows/
          $archive = "artifacts/Neutrivox-win-x64-$version.zip"
          $installer = "artifacts/installer/Neutrivox-Setup-$version.exe"
          Compress-Archive -Path artifacts/windows/* -DestinationPath $archive -Force
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$archiveHash *Neutrivox-win-x64-$version.zip",
            "$installerHash *Neutrivox-Setup-$version.exe"
          ) | Set-Content artifacts/SHA256SUMS.txt

      - name: Verify release payload
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $required = @(
            "artifacts/Neutrivox-win-x64-$version.zip",
            "artifacts/installer/Neutrivox-Setup-$version.exe",
            'artifacts/SHA256SUMS.txt'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Release payload missing: $file" }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neutrivox-windows-release
          path: artifacts/

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Neutrivox-win-x64-*.zip
            artifacts/installer/Neutrivox-Setup-*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
