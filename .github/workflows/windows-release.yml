name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate release documentation
        shell: pwsh
        run: |
          $files = @('README_RU.md','README_EN.md','CHANGELOG.md','VERSION.txt')
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Neutrivox.sln

      - name: Release build
        run: dotnet build Neutrivox.sln --configuration Release --no-restore

      - name: Smoke build
        run: dotnet build tools/Neutrivox.Smoke/Neutrivox.Smoke.csproj --configuration Release

      - name: Smoke test
        run: dotnet run --project tools/Neutrivox.Smoke/Neutrivox.Smoke.csproj --configuration Release --no-build

      - name: Publish Windows x64
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -Configuration Release -Runtime win-x64 -OutputDirectory artifacts/windows

      - name: Verify published executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'artifacts/windows/Neutrivox.exe')) { throw 'Published executable missing' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc 'installer/Neutrivox.iss'

      - name: Create archives and checksums
        shell: pwsh
        run: |
          Copy-Item README_RU.md artifacts/windows/
          Copy-Item README_EN.md artifacts/windows/
          Copy-Item CHANGELOG.md artifacts/windows/
          Copy-Item VERSION.txt artifacts/windows/
          Compress-Archive -Path artifacts/windows/* -DestinationPath artifacts/Neutrivox-win-x64.zip -Force
          Get-FileHash artifacts/Neutrivox-win-x64.zip -Algorithm SHA256 | Out-File artifacts/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neutrivox-windows-release
          path: artifacts/

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Neutrivox-win-x64.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
