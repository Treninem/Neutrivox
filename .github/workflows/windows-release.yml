name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Neutrivox.sln

      - name: Release build
        run: dotnet build Neutrivox.sln --configuration Release --no-restore

      - name: Smoke build
        run: dotnet build tools/Neutrivox.Smoke/Neutrivox.Smoke.csproj --configuration Release

      - name: Smoke test
        run: dotnet run --project tools/Neutrivox.Smoke/Neutrivox.Smoke.csproj --configuration Release --no-build

      - name: Publish Windows x64
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -Configuration Release -Runtime win-x64 -OutputDirectory artifacts/windows

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'artifacts/windows/Neutrivox.exe'
          if (-not (Test-Path $exe)) { throw 'Published Neutrivox.exe was not found.' }
          Write-Host "Verified $exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.1.0' }
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found at $iscc" }
          & $iscc "/DMyAppVersion=$version" 'installer/Neutrivox.iss'
          $installer = "artifacts/installer/Neutrivox-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }

      - name: Create archives and checksums
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.1.0' }
          Compress-Archive -Path artifacts/windows/* -DestinationPath "artifacts/Neutrivox-win-x64-$version.zip" -Force
          $files = @(
            "artifacts/Neutrivox-win-x64-$version.zip",
            "artifacts/installer/Neutrivox-Setup-$version.exe"
          )
          $hashLines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$([System.IO.Path]::GetFileName($file))"
          }
          $hashLines | Set-Content "artifacts/SHA256SUMS.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neutrivox-windows-release
          path: |
            artifacts/Neutrivox-win-x64-*.zip
            artifacts/installer/Neutrivox-Setup-*.exe
            artifacts/SHA256SUMS.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Neutrivox-win-x64-*.zip
            artifacts/installer/Neutrivox-Setup-*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
