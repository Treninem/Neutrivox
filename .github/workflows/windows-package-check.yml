name: Windows Package Check

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION.txt value: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Neutrivox.sln

      - name: Build solution
        run: dotnet build Neutrivox.sln --configuration Release --no-restore

      - name: Build and run smoke test
        shell: pwsh
        run: |
          dotnet build tools/Neutrivox.Smoke/Neutrivox.Smoke.csproj --configuration Release
          dotnet run --project tools/Neutrivox.Smoke/Neutrivox.Smoke.csproj --configuration Release --no-build

      - name: Build license issuer
        run: dotnet build tools/Neutrivox.LicenseIssuer/Neutrivox.LicenseIssuer.csproj --configuration Release

      - name: Publish Windows x64
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -Configuration Release -Runtime win-x64 -OutputDirectory artifacts/windows

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'artifacts/windows/Neutrivox.exe')) { throw 'Published executable missing.' }
          $info = (Get-Item 'artifacts/windows/Neutrivox.exe').VersionInfo
          Write-Host "Published file version: $($info.FileVersion)"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc "/DMyAppVersion=$version" 'installer/Neutrivox.iss'
          $installer = "artifacts/installer/Neutrivox-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer output missing: $installer" }

      - name: Upload package check artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neutrivox-package-check-${{ steps.version.outputs.version }}
          path: |
            artifacts/windows/
            artifacts/installer/
